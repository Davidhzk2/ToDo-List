<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title> ToDo List </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">ToDo List</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    <h4>Agregar Tarea</h4>
    <ion-item>
      <ion-input placeholder="Nombre tarea" [(ngModel)]="taskName"></ion-input>
    </ion-item>
    <ion-button [disabled]="!taskName.trim()" (click)="addTask()">
      <ion-icon name="add"></ion-icon>
      <span>Agregar tarea</span>
    </ion-button>

    <div>
      <h5>Mis tareas</h5>
      @for(task of taskList; track task.name){
      <div class="task-item {{task.completed ? 'completed' : ''}}">
        <ion-checkbox (ionChange)="toggleTaskCompletion(task, $event)" [checked]="task.completed"></ion-checkbox>
        <span>{{task.name}}</span>
        <ion-button (click)="deleteTask(task)" color="danger">
          <ion-icon name="trash-outline"></ion-icon>
          <span>Eliminar</span>
        </ion-button>
      </div>

      }@empty{
      <p>no tienes tareas agregadas!</p>
      }
    </div>
  </div>
</ion-content>
