<ion-header>
  <ion-toolbar color="secondary">
    <ion-title>Gestionar Categorías</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">Cerrar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- Nueva Categoría -->
  <ion-item class="ion-margin-bottom">
    <ion-input 
      [(ngModel)]="newCategoryName" 
      placeholder="Nueva categoría..." 
      (keyup.enter)="addCategory()">
    </ion-input>
    <ion-button color="success" (click)="addCategory()" [disabled]="!newCategoryName.trim()">
      <ion-icon name="add"></ion-icon>
    </ion-button>
  </ion-item>

  <!-- Lista de Categorías Existentes -->
  <ion-list>
    <ng-container *ngIf="categories?.length; else emptyList">
      <ion-item *ngFor="let cat of categories">
        <ion-label>{{ cat.name }}</ion-label>
        <!-- <ion-button slot="end" fill="clear" color="medium" (click)="editCategory(cat)">
          <ion-icon name="create-outline" slot="icon-only"></ion-icon>
        </ion-button> -->
        <!-- <ion-button slot="end" fill="clear" color="danger" (click)="deleteCategory(cat)">
          <ion-icon name="trash-outline" slot="icon-only"></ion-icon>
        </ion-button> -->
      </ion-item>
    </ng-container>
    <ng-template #emptyList>
      <ion-item>
        <ion-label>No tienes categorías agregadas!</ion-label>
      </ion-item>
    </ng-template>
  </ion-list>
</ion-content>
